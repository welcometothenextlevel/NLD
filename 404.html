<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Next Digital Level</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F1012">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: left; }
    .nf__inner { max-width: 46ch; padding: var(--gutter); }
    .nf__code { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: var(--s-5); }
    .nf h1 { font-size: clamp(3rem, 10vw, 6rem); margin-bottom: var(--s-5); }
    .nf p { color: var(--paper-dim); margin-bottom: var(--s-7); }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__inner">
      <p class="nf__code">Error 404 — page not found</p>
      <h1>This one's off the <span class="accent">map.</span></h1>
      <p>The page you're after doesn't exist or has moved. Let's get you back to solid ground.</p>
      <a class="btn btn--primary" href="index.html">Back to home <span class="arw" aria-hidden="true">&rarr;</span></a>
    </div>
  </main>
</body>
</html>
